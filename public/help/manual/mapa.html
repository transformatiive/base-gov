  <h1>Mapa</h1>
<p class="lead">Volume de contratos da atividade por distrito. Clique num distrito para entidades e procedimentos.</p>
<p>Pode filtrar o período mês a mês. A dimensão do círculo é o valor. «Desconhecido» agrupa contratos sem distrito inferido.</p>
